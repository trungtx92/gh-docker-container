name: 'Deploy to GCS'
description: 'Deploys a JavaScript project to an GCS bucket'
inputs:
  bucket-name:
    description: 'The name of the GCS bucket to deploy to'
    required: true
  bucket-region:
    description: 'The AWS region of the GCS bucket'
    required: false
    default: 'us-east-1'
  dist-folder:
    description: 'The folder containing the build artifacts to deploy'
    required: true
    default: 'dist'
outputs:
  website-url:
    description: 'The URL of the deployed site'
runs:
  using: 'node24'
  main: 'main.js'